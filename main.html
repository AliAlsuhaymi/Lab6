<!DOCTYPE html>
<html>
<head>
    <title>Lab 6</title>
</head>
<body style="text-align:center; font-family:Arial; background:#eee;">

<h1 style="font-size:60px;">Lab 6</h1>
<h2 style="font-size:35px;">Like or dislike</h2>

<button onclick="vote('like')" style="font-size:30px; padding:10px 20px; margin:10px;">
    👍 <span id="like">100</span>
</button>

<button onclick="vote('dislike')" style="font-size:30px; padding:10px 20px; margin:10px;">
    👎 <span id="dislike">20</span>
</button>

<h2 style="font-size:35px; margin-top:30px;">Comments</h2>

<textarea id="comment" rows="8" cols="60" placeholder="Write a comment..."
          style="font-size:28px; padding:10px;"></textarea>
<br><br>

<button onclick="submitComment()" style="font-size:28px; padding:8px 20px; margin:5px;">
    Submit
</button>

<button onclick="resetAll()" style="font-size:28px; padding:8px 20px; margin:5px;">
    Clear
</button>

<div id="comments" style="font-size:28px; margin-top:20px;"></div>

<script>
    var likes = Number(getCookie("likes")) || 100;
    var dislikes = Number(getCookie("dislikes")) || 20;

    document.getElementById("like").innerHTML = likes;
    document.getElementById("dislike").innerHTML = dislikes;
    document.getElementById("comments").innerHTML = getCookie("comment");

    function getCookie(name) {
        var cookies = document.cookie.split("; ");
        for (var i = 0; i < cookies.length; i++) {
            var parts = cookies[i].split("=");
            if (parts[0] == name) {
                return decodeURIComponent(parts[1]);
            }
        }
        return "";
    }

    function vote(type) {
        if (getCookie("vote") != "") {
            alert("You already voted");
            return;
        }

        if (type == "like") {
            likes++;
            document.cookie = "vote=like";
            document.cookie = "likes=" + likes;
        } else {
            dislikes++;
            document.cookie = "vote=dislike";
            document.cookie = "dislikes=" + dislikes;
        }

        document.getElementById("like").innerHTML = likes;
        document.getElementById("dislike").innerHTML = dislikes;
    }

    function submitComment() {
        var text = document.getElementById("comment").value;

        if (text == "") {
            alert("Write a comment");
            return;
        }

        if (getCookie("comment") != "") {
            alert("You already commented");
            return;
        }

        document.cookie = "comment=" + encodeURIComponent(text);
        document.getElementById("comments").innerHTML = text;
        document.getElementById("comment").value = "";
    }

    function resetAll() {
        document.cookie = "vote=; max-age=0";
        document.cookie = "comment=; max-age=0";
        document.cookie = "likes=; max-age=0";
        document.cookie = "dislikes=; max-age=0";
        location.reload();
    }
</script>

</body>
</html>
